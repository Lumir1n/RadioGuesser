; RadioGuesser editor configuration

[/Script/UnrealEd.LevelEditorPlaySettings]
; Auto-start PIE in the selected viewport when the editor finishes loading the map.
; This replaces having to press Alt+P / Ctrl+Alt+F11 every time.
bAutoPlayOnLaunch=True
; Play in the active level editor viewport (no separate window needed)
PlayNetMode=PIE_Standalone
NewWindowWidth=1280
NewWindowHeight=720
