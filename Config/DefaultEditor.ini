; RadioGuesser editor configuration

[/Script/UnrealEd.LevelEditorPlaySettings]
; Auto-start PIE in the selected viewport when the editor finishes loading the map.
; This replaces having to press Alt+P / Ctrl+Alt+F11 every time.
bAutoPlayOnLaunch=True
; Play in the active level editor viewport (no separate window needed)
PlayNetMode=PIE_Standalone
NewWindowWidth=1280
NewWindowHeight=720

[/Script/LiveCoding.LiveCodingSettings]
; Disable LiveCoding for this project.
; LiveCoding cannot safely re-instance UGameInstanceSubsystem subclasses —
; when it tries to reload RGMatchSubsystem the old UClass* stays registered,
; and the next PIE session crashes with "Ret->IsA(T::StaticClass())" in
; UGameInstance::Init(). Full editor restart is required after a code change.
bEnabled=False
